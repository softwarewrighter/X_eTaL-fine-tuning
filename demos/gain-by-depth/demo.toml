title = "The gain by depth"
summary = "What happens when the same mixing table is applied at every one of 48 layers? HC's table and mHC's, each multiplied by itself once per layer, every product measured two ways, each named: the paper's Amax gain (the largest row sum, forward; the largest column sum, backward) and the Python's proxy (the largest entry, as a power of ten). HC's grows as its row sum to the power of the depth, 3.82^48 at the paper's start, mHC's stays at 1; the untrained proxy (6.39, 13.37, 27.35) beside the Python's trained run (7.0, 14.4, 27.3), the paper's 3000 and 1.6 quoted; a slider shifts the logits, and HC's gain only holds level at a row sum of exactly 1."
