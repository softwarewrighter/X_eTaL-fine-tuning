title = "Residual streams"
summary = "Why does a deep model need a skip connection, and what happens when there are four of them? A list of 8 numbers sent through 48 small layers, measured after every one: with the blocks replacing the list, two inputs a hundredth apart give the same output within two dozen layers; with the blocks adding to it, the difference goes through, at three weight scales set up as data. Then Hyper-Connections: four streams, the three tables that mix them (HC's carried-state table with rows summing to 3.82, mHC's projected by Sinkhorn-Knopp to rows and columns summing to 1), and one layer stepped through in nine stages with every number shown."
