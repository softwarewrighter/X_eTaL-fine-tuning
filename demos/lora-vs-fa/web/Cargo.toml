[package]
name = "lora-vs-fa-web"
description = "LoRA beside LoRA-FA: fitting a known matrix against the Eckart-Young optimum and the frozen row space, then learning from examples with held-out and retention losses beside full fine-tuning"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
lesson = { path = "../../../shared/lesson" }
microscope = { path = "../../../work/xetal-ml/shared/microscope" }
yew = { version = "0.21", features = ["csr"] }
web-sys = { version = "0.3", features = ["HtmlInputElement", "Element", "EventTarget"] }
console_error_panic_hook = "0.1"

[workspace]
