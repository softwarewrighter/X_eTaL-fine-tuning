<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoRA hello</title>
  <link data-trunk rel="rust" data-bin="lora-hello-web" />
  <link data-trunk rel="copy-file" href="../../../images/xetal-logo-orange.png" />
  <link data-trunk rel="icon" href="../../../images/favicon.ico" />
  <link data-trunk rel="css" href="../../../work/xetal-ml/shared/microscope/microscope.css" />
  <style>
    .controls label { display: inline-flex; align-items: center; gap: 6px; font-size: 0.95em; }
    .controls input[type=number] { width: 5.5em; font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    .muted { color: var(--muted); font-size: 0.9em; }
    table.vectors { border-collapse: collapse; margin: 8px 0; }
    table.vectors th { text-align: left; padding: 4px 14px 4px 0; font-weight: 600; white-space: nowrap; }
    table.vectors td { padding: 4px 10px; text-align: right; font-variant-numeric: tabular-nums; border: 1px solid var(--line); min-width: 5.5em; }
    table.vectors tr.sum th, table.vectors tr.sum td { border-top: 2px solid var(--fg); }
    table.vectors td.changed { box-shadow: inset 0 0 0 2px var(--accent); font-weight: 700; }
    table.facts td { padding: 3px 14px 3px 0; }
    table.facts td:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
    main .panel { margin-bottom: 14px; }
    pre.err { color: #c92a2a; white-space: pre-wrap; }
  </style>
</head>
<body></body>
</html>
