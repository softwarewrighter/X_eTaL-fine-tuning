title = "Training at depth"
summary = "Does the bound on the gain matter once a model is trained? The plain skip, HC and mHC trained with Adam on a tiny task (each of 16 tokens, its successor the target) at 12, 24 and 48 layers, 800 steps each from one start, the gradient written out layer by layer (the Sinkhorn rounds included) and checked against central differences. At 12 and 24 layers all three learn; at 48 the plain skip does not, HC and mHC do, HC with its gain near 10^27.5 throughout; no NaN event in any run. The long runs trained offline by the same program and replayed, a short run computed on the page beginning exactly as its record; the Python's final losses beside, the difference named."
